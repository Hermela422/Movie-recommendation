<!DOCTYPE html>
<html>
<head>
  <title>Movie Recommendation</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-dark text-white">
        <h2 class="mb-0">Age-Based Movie Recommendations</h2>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label for="userAgeInput" class="form-label">Enter Your Age:</label>
          <input type="number" id="userAgeInput" class="form-control" placeholder="00">
        </div>
        <button class="btn btn-success bg-dark" onclick="handleRecommendation()">Get Recommendations</button>
        <hr />
        
        <div id="output" class="mt-3">

        </div>
        
      </div>
    </div>
  </div>

  <script>
    const movieCategories = [
      {
        category: "Kids",
        minAge: 1,
        maxAge: 12,
        movies: [
          { name: "BEE Movie", image: "IMG_5778.JPG" },
          { name: "boss baby", image: "IMG_5779.JPG" }
        ]
      },
      {
        category: "Teens-ages",
        minAge: 13,
        maxAge: 19,
        movies: [
          { name: "College Girl", image: "IMG_5780.JPG" },
          { name: "New York Minute", image: "IMG_5781.JPG" }
        ]
      },
      {
        category: "Grown-ups",
        minAge: 20,
        maxAge: 70,
        movies: [
          { name: "Call Me by Your Name", image: "IMG_5782.JPG" },
          { name: "Game of Thrones", image: "IMG_5783.JPG" }
        ]
      },
      {
        category: "oldpeoples",
        minAge: 71,
        maxAge: 100,
        movies: [
          { name: "I Care a Lot", image: "IMG_5784.JPG" },
          { name: "Rise Up Together", image: "IMG_5785.JPG" }
        ]
      }
    ];

    const recommendMovies = (userAge) => {
      const outputDiv = document.getElementById("output");

      if (typeof userAge !== "number" || isNaN(userAge)||  userAge < 1 || userAge > 100) {
        outputDiv.innerHTML = '<div class="alert alert-danger">Invalid age. Please enter a number between 1 and 100.</div>';
        return;
      }

      const category = movieCategories.find(cat => userAge >= cat.minAge && userAge <= cat.maxAge);

      if (!category) {
        outputDiv.innerHTML = '<div class="alert alert-warning">No matching category found.</div>';
        return;
      }

      const shuffled = category.movies.slice().sort(() => 0.5 - Math.random());
      const selectedMovies = shuffled.slice(0, 2);

      let html = `<div class="alert alert-info">
        <p><strong>Recommended Movies for your Age ${userAge}</strong> [Category: ${category.category}]:</p>
      </div>`;

      html += `<div class="row">`;
      selectedMovies.forEach((movie) => {
        html += `
          <div class="col-md-6 mb-4">
            <div class="card h-100">
              <img src="${movie.image}" class="card-img-top" alt="${movie.name}">
              <div class="card-body">
                <h5 class="card-title">${movie.name}</h5>
                
              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      outputDiv.innerHTML = html;
    };

    const handleRecommendation = () => {
      const input = document.getElementById("userAgeInput").value;
      recommendMovies(parseInt(input));
    };
  </script>

</body>
</html>
